<!-- @dsCard group="Foundations" -->
<!doctype html>
<html><head><meta charset="utf-8">
  <link rel="stylesheet" href="../../../styles.css">
  <style>
    body { margin: 0; padding: 24px; background: rgba(var(--surface-950), 1); }
    .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; align-items: start; }
    .pane { background: rgba(var(--surface-900), 1); border: 1px solid rgba(var(--edge-card), 1); border-radius: 10px; padding: 16px; }
    .pane h3 { margin: 0 0 12px; font: 600 12px 'DM Sans', sans-serif; letter-spacing: .06em; text-transform: uppercase; color: rgba(var(--tx-3), 1); }
    .grp h4 { margin: 14px 0 6px; font: 600 11px 'DM Sans', sans-serif; color: rgba(var(--tx-4), 1); }
    .row { display: flex; align-items: center; gap: 10px; padding: 3px 0; }
    .chip { width: 34px; height: 20px; border-radius: 4px; flex: none; }
    .name { font: 400 12px 'JetBrains Mono', monospace; color: rgba(var(--tx-2), 1); flex: 1; }
    .pill { font: 400 11px 'DM Sans', sans-serif; border-radius: 6px; padding: 2px 8px; }
    .bar { height: 6px; border-radius: 3px; flex: 1; }
  </style>
</head><body>
  <div class="cols">
    <div class="pane" data-theme="dark" id="dark"><h3>Dark (default)</h3></div>
    <div class="pane" data-theme="light" id="light"><h3>Light</h3></div>
  </div>
  <script>
    var STATUS = ['st-open','st-progress','st-paused','st-review','st-done','st-cancel','st-error'];
    var PIPES = ['indigo','cyan','amber','green','rose','mauve','none'];
    ['dark','light'].forEach(function (theme) {
      var pane = document.getElementById(theme);

      var sg = document.createElement('div');
      sg.className = 'grp';
      sg.innerHTML = '<h4>Ticket lifecycle</h4>';
      STATUS.forEach(function (token) {
        var value = getComputedStyle(pane).getPropertyValue('--' + token).trim();
        var row = document.createElement('div');
        row.className = 'row';
        var chip = document.createElement('div');
        chip.className = 'chip';
        chip.style.background = 'hsl(' + value + ' / 1)';
        var name = document.createElement('div');
        name.className = 'name';
        name.textContent = '--' + token;
        var pill = document.createElement('span');
        pill.className = 'pill';
        pill.textContent = token.replace('st-', '');
        pill.style.color = 'hsl(' + value + ' / 1)';
        pill.style.background = 'hsl(' + value + ' / 0.12)';
        row.appendChild(chip); row.appendChild(name); row.appendChild(pill);
        sg.appendChild(row);
      });
      pane.appendChild(sg);

      var pg = document.createElement('div');
      pg.className = 'grp';
      pg.innerHTML = '<h4>Pipeline hues, [data-pipe-color]</h4>';
      PIPES.forEach(function (pipe) {
        var probe = document.createElement('div');
        probe.setAttribute('data-pipe-color', pipe);
        if (theme === 'light') probe.setAttribute('data-theme', 'light');
        pane.appendChild(probe);
        var value = getComputedStyle(probe).getPropertyValue('--pipe-h').trim();
        pane.removeChild(probe);

        var row = document.createElement('div');
        row.className = 'row';
        var name = document.createElement('div');
        name.className = 'name';
        name.textContent = pipe;
        var bar = document.createElement('div');
        bar.className = 'bar';
        bar.style.background = 'hsl(' + value + ' / 1)';
        row.appendChild(name); row.appendChild(bar);
        pg.appendChild(row);
      });
      pane.appendChild(pg);
    });
  </script>
</body></html>
