name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9
        with:
          version: latest

      - name: go mod tidy
        run: go mod tidy -diff

      - name: govulncheck
        run: go tool govulncheck ./...

      - name: deadcode
        run: go tool deadcode -test ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -race -timeout 10m ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./cmd/kontora

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      # Use the same image as hack/visual.Dockerfile to avoid installing Ubuntu packages on each run.
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
      options: --init --shm-size=1g
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6
        with:
          go-version-file: go.mod

      # Node is test-only. Ordinary Go tests/build jobs do not install npm deps.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26'

      - name: Install Playwright and check the browser image version
        run: |
          npm ci --prefix internal/web/testdata --ignore-scripts --no-audit --no-fund
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { readFileSync } = require('node:fs');
          const { version } = require('./internal/web/testdata/node_modules/playwright/package.json');
          const { driverVersion } = JSON.parse(readFileSync('/ms-playwright/.docker-info', 'utf8'));
          assert.equal(driverVersion, version, 'The browser image must match the Playwright npm package');
          NODE

      - name: Test real embedded UI with offline browser fixtures
        env:
          KONTORA_TEST_BROWSER: '1'
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
          BROWSER_ENGINE: ${{ matrix.browser }}
        run: go test -count=1 -timeout 42m ./internal/web -run "^TestMobileBrowserJS$/^${BROWSER_ENGINE}$" -v

  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Compare UI screenshots in the pinned renderer
        run: make test-visual

  pi-sdk:
    runs-on: ubuntu-latest
    container: node:26
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install Docker-pinned Pi SDK
        run: npm install --prefix "$RUNNER_TEMP/pi-sdk" --ignore-scripts --no-audit --no-fund --save-exact "@earendil-works/pi-coding-agent@$(awk -F= '/^ARG PI_VERSION=/{print $2}' Dockerfile)"

      - name: Test Pi lifecycle with offline models
        env:
          KONTORA_PI_SDK_DIR: ${{ runner.temp }}/pi-sdk/node_modules/@earendil-works/pi-coding-agent
        run: node --test internal/daemon/testdata/pi_extension.sdk.test.mjs

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      # The changelog fixture builds its own repository, so it needs no history here.
      - name: Test maintenance scripts
        run: make test-scripts
