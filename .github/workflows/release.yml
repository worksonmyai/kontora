name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - runner: macos-latest
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          install-only: true

      - name: Build
        run: goreleaser build --single-target --clean --snapshot
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}

      - name: Package binary
        run: |
          cd dist/kontora_*/
          tar czf ../../kontora_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz kontora

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kontora_${{ matrix.goos }}_${{ matrix.goarch }}
          path: kontora_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate changelog
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Generated once, from the tag, and handed to update-formula as an
          # artifact, so the release notes and CHANGELOG.md cannot disagree.
          ./hack/changelog-for-release.sh "${REF_NAME#v}" "" "$REF_NAME" > changelog-section.md
          # The release title already carries the version, so the notes drop the
          # heading. They keep the short hashes that the changelog file omits.
          ./hack/changelog-for-release.sh --no-heading --hashes "${REF_NAME#v}" "" "$REF_NAME" > release-notes.md

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: gh release create "$REF_NAME" artifacts/*.tar.gz --title "$REF_NAME" --notes-file release-notes.md

      # Uploaded after the download step so it stays out of artifacts/.
      - name: Upload changelog section
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: changelog-section
          path: changelog-section.md

  update-formula:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: main
          persist-credentials: false

      - name: Download changelog section
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: changelog-section
          path: ${{ runner.temp }}/changelog

      - name: Update Homebrew formula and changelog
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          REVISION: ${{ github.sha }}
        run: |
          sed -i "s/tag: \"v[^\"]*\"/tag: \"${TAG}\"/" Formula/kontora.rb
          sed -i "s/revision: \"[^\"]*\"/revision: \"${REVISION}\"/" Formula/kontora.rb
          # The section the release job generated from the tag. Inserting a
          # version the file already has is a no-op, so a re-run of this job
          # cannot duplicate it.
          ./hack/insert-changelog-section.sh CHANGELOG.md < "${RUNNER_TEMP}/changelog/changelog-section.md"

      - name: Create PR
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git add Formula/kontora.rb CHANGELOG.md
          git diff --cached --quiet && exit 0
          BRANCH="update-formula-${TAG}"
          git push origin --delete "$BRANCH" 2>/dev/null || true
          git checkout -b "$BRANCH"
          git commit -m "Release ${TAG}: formula and changelog"
          git push -u origin "$BRANCH"
          if ! gh pr view "$BRANCH" &>/dev/null; then
            gh pr create --title "Release ${TAG}: formula and changelog" --body "Automated formula bump and changelog entry for release ${TAG}." --base main
          fi
