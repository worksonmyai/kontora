tickets_dir: ~/org/tickets

branch_naming:
  mode: slug

agents:
  claude:
    binary: claude

stages:
  code:
    prompt: Write code.

pipelines:
  default:
    - stage: code
      agent: claude
      on_success: done
      on_failure: pause

projects:
  legacy:
    path: ~/projects/legacy
    branch_naming:
      mode: off
