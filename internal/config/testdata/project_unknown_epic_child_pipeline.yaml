tickets_dir: ~/org/tickets

agents:
  claude:
    binary: claude

stages:
  code:
    prompt: Write code.

pipelines:
  implement:
    - stage: code
      agent: claude
      on_success: done
      on_failure: pause

projects:
  kontora:
    path: ~/projects/kontora
    pipeline: implement
    epic_child_pipeline: missing-pipeline
