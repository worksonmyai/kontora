tickets_dir: ~/org/tickets

agents:
  claude:
    binary: claude

stages:
  code:
    prompt: Write code.

pipelines:
  implement:
    - stage: code
      agent: claude
      on_success: done
      on_failure: pause

  epic-child:
    - stage: code
      agent: claude
      on_success: done
      on_failure: pause

projects:
  kontora:
    path: ~/projects/kontora
    pipeline: implement
    epic_child_pipeline: epic-child
    agent: claude
    branch_prefix: feature
  widget-api:
    path: ~/projects/widget-api
    epic_child_pipeline: ""
  epic-only:
    path: ~/projects/epic-only
    epic_child_pipeline: epic-child
