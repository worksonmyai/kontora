site_name: Kontora
site_url: https://worksonmyai.github.io/kontora
site_description: Run AI coding agents on tickets and review their changes from a web or terminal board.
repo_url: https://github.com/worksonmyai/kontora
repo_name: worksonmyai/kontora

theme:
  name: material
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  font:
    text: DM Sans
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.sections
    - content.code.copy
    - toc.follow

nav:
  - Getting started: getting-started.md
  - Guides:
      - Remote access: remote.md
      - Automations: automations.md
  - Reference:
      - CLI: cli.md
      - Configuration: configuration.md
      - Tickets: tickets.md
      - API: api.md
  - Development:
      - Orchestrator components (disabled): orchestrator.md

exclude_docs: |
  /README.md

validation:
  links:
    anchors: warn

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - tables
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
